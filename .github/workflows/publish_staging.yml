# PLAYGROUND STAND-IN — deploys nothing.
#
# Production's publish_staging.yml (OP-TED/OP-TED.github.io, branch develop) builds the site
# and deploys it to the REAL staging site, OP-TED/docs-staging, on every push to develop. The
# release wizard pushes to this playground's develop during every docs-publication test, so the
# production workflow must never run here: it is harmless today only because this playground
# has no secrets.
#
# This stand-in keeps the same name and triggers, so any run the wizard might observe looks the
# same, and does nothing.

name: STAGING - Build and publish TED Developer Docs

on:
  workflow_dispatch:
  push:
    branches:
      - develop

jobs:
  publish_site:
    name: "Build and publish site with Antora"
    runs-on: ubuntu-latest
    steps:
      - name: Playground — nothing is built or deployed
        run: |
          echo "Playground stand-in for the staging deployment."
          echo "Production would now build the site and deploy it to OP-TED/docs-staging."
