# PLAYGROUND STAND-IN — indexes nothing.
#
# Production's index_site.yml (OP-TED/OP-TED.github.io) runs every night, reads the run history
# of the PRODUCTION repository and, when the site was rebuilt, deletes and rebuilds the
# PRODUCTION search index on Algolia. On this playground it must never run: it is harmless today
# only because this playground has no secrets.
#
# This stand-in keeps the same name, runs only when started by hand (no nightly schedule), and
# does nothing.

name: Index TED Developer Docs

on:
  workflow_dispatch:

jobs:
  index_site:
    name: "Index site using Docsearch Crawler"
    runs-on: ubuntu-latest
    steps:
      - name: Playground — nothing is indexed
        run: |
          echo "Playground stand-in for the search indexing."
          echo "Production would now rebuild the site's search index on Algolia."
